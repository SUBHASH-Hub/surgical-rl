<svg width="680" viewBox="0 0 680 740" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Phase 4G hybrid C++/Python surgical system architecture</title>
<desc>Five-layer architecture showing data flow from surgeon console down through behaviour tree, C++ action servers, Python ML services, and SOFA physics</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
text { font-family: ui-monospace, 'Cascadia Code', monospace; }
.th { font-size: 13px; font-weight: 600; fill: #1a1a2e; }
.ts { font-size: 11px; font-weight: 400; fill: #444; }
.arr { stroke: #666; stroke-width: 1.2; fill: none; }
</style>
</defs>

<!-- Layer 5: Human Interface — purple -->
<rect x="40" y="24" width="600" height="64" rx="8" fill="#EDE9F8" stroke="#7B70CC" stroke-width="1"/>
<text class="th" x="340" y="50" text-anchor="middle">Layer 5 — Surgeon console</text>
<text class="ts" x="340" y="70" text-anchor="middle">Python · curses · S / R / E / Q keys · publishes /surgeon_stop · /emergency_stop</text>

<!-- Arrow down -->
<line x1="340" y1="88" x2="340" y2="110" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="103" fill="#888">/console_feedback ↑</text>

<!-- Layer 4: BT — teal -->
<rect x="40" y="110" width="600" height="64" rx="8" fill="#D6F0E8" stroke="#1D9E75" stroke-width="1"/>
<text class="th" x="340" y="136" text-anchor="middle">Layer 4 — Behaviour tree orchestrator</text>
<text class="ts" x="340" y="156" text-anchor="middle">Python · py_trees_ros · Approach → Retract → Hold · ForceCondition guard at 10 Hz</text>

<!-- Arrow down -->
<line x1="340" y1="174" x2="340" y2="196" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="189" fill="#888">/approach_policy_cpp · /retract_policy_cpp · /hold_policy_cpp</text>

<!-- Layer 3: C++ control — blue outer -->
<rect x="40" y="196" width="600" height="128" rx="8" fill="#DCEEFB" stroke="#378ADD" stroke-width="1"/>
<text class="th" x="340" y="220" text-anchor="middle">Layer 3 — C++ control layer  (rclcpp · no GIL · true parallel threads)</text>

<!-- Three inner C++ boxes -->
<rect x="58" y="232" width="174" height="52" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text class="th" x="145" y="254" text-anchor="middle" fill="#042C53">approach_policy_cpp</text>
<text class="ts" x="145" y="272" text-anchor="middle" fill="#0C447C">Proportional controller</text>

<rect x="253" y="232" width="174" height="52" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text class="th" x="340" y="254" text-anchor="middle" fill="#042C53">retract_policy_cpp</text>
<text class="ts" x="340" y="272" text-anchor="middle" fill="#0C447C">PPO via /ppo_predict</text>

<rect x="448" y="232" width="174" height="52" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text class="th" x="535" y="254" text-anchor="middle" fill="#042C53">hold_policy_cpp</text>
<text class="ts" x="535" y="272" text-anchor="middle" fill="#0C447C">Zero-action hold</text>

<text class="ts" x="340" y="314" text-anchor="middle" fill="#185FA5">std::atomic&lt;bool&gt; stop flags · MultiThreadedExecutor · 3–4 callback groups · dual freeze loop</text>

<!-- Arrows down from C++ layer to Python services -->
<line x1="145" y1="324" x2="145" y2="360" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="87" y="346" fill="#888">/sofa_step</text>

<line x1="310" y1="324" x2="245" y2="360" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="193" y="346" fill="#888">/ppo_predict</text>

<line x1="370" y1="324" x2="435" y2="360" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="388" y="346" fill="#888">/sofa_step</text>

<line x1="535" y1="324" x2="535" y2="360" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="548" y="346" fill="#888">/sofa_step</text>

<!-- Layer 2: Python ML/physics — amber outer -->
<rect x="40" y="360" width="600" height="120" rx="8" fill="#FEF3DC" stroke="#BA7517" stroke-width="1"/>
<text class="th" x="340" y="384" text-anchor="middle">Layer 2 — Python ML / physics services</text>

<rect x="58" y="396" width="264" height="52" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
<text class="th" x="190" y="416" text-anchor="middle" fill="#412402">sofa_step_service</text>
<text class="ts" x="190" y="434" text-anchor="middle" fill="#633806">env.step() · SofaPython3 · GIL held ~65ms</text>

<rect x="358" y="396" width="264" height="52" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
<text class="th" x="490" y="416" text-anchor="middle" fill="#412402">ppo_predict_service</text>
<text class="ts" x="490" y="434" text-anchor="middle" fill="#633806">policy.predict() · PyTorch releases GIL → GPU</text>

<text class="ts" x="340" y="468" text-anchor="middle" fill="#854F0B">SOFA must stay Python (SofaPython3 bindings). PPO stays Python — PyTorch GPU releases GIL.</text>

<!-- Arrows down -->
<line x1="190" y1="480" x2="190" y2="506" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="480" x2="490" y2="506" class="arr" marker-end="url(#arrow)"/>

<!-- Layer 1: Safety + Bridge — coral -->
<rect x="40" y="506" width="600" height="116" rx="8" fill="#FAECEA" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="340" y="530" text-anchor="middle">Layer 1 — Safety + simulation bridge</text>

<rect x="58" y="544" width="264" height="52" rx="6" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="190" y="564" text-anchor="middle" fill="#4A1B0C">sofa_bridge_node</text>
<text class="ts" x="190" y="582" text-anchor="middle" fill="#712B13">SOFA↔ROS2 · /tissue_force_proxy 50 Hz</text>

<rect x="358" y="544" width="264" height="52" rx="6" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="490" y="564" text-anchor="middle" fill="#4A1B0C">safety_watchdog_node</text>
<text class="ts" x="490" y="582" text-anchor="middle" fill="#712B13">IEC 62304 Class C · 50 Hz · independent PID</text>

<!-- Emergency stop dashed line up the right side -->
<line x1="654" y1="596" x2="654" y2="56" stroke="#E24B4A" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)" fill="none"/>
<text class="ts" x="668" y="380" text-anchor="middle" fill="#A32D2D" transform="rotate(90,668,380)">/emergency_stop → all layers</text>

<!-- Stop latency annotation -->
<rect x="40" y="636" width="600" height="60" rx="6" fill="none" stroke="#aaa" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="ts" x="340" y="657" text-anchor="middle" fill="#444">Stop latency:  Python servers (Phase 4E) ~15–20 steps ≈ 1 second</text>
<text class="ts" x="340" y="675" text-anchor="middle" fill="#185FA5">C++ servers  (Phase 4G) ~1–2 steps ≈ 130ms  →  10× faster</text>
<text class="ts" x="340" y="690" text-anchor="middle" fill="#888">Root cause: Python GIL held during env.step(). C++ has no GIL — stop fires on separate CPU core.</text>
</svg>
